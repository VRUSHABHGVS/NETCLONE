<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NetClone - Verify</title><link rel="stylesheet" href="/auth/verify.css"><link rel="shortcut icon" href="/auth/favicon.ico"></head>
<body><div class="netflix-bg"></div><div class="container"><div class="otp-card"><img src="/auth/favicon.ico" alt="NetClone" class="logo"><h1>Check your email</h1><p>We've sent a 6-digit code to <strong id="email">your email</strong>.</p><div class="otp-inputs" id="otp-inputs"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><p id="error-msg" class="error-text"></p><button id="verify-btn" class="verify-btn">Verify</button><div class="footer-links"><span>Didn't receive it?</span><a href="#" id="resend-link">Resend Code</a></div></div></div>
<script>
const inputs=[...document.querySelectorAll('.otp-inputs input')], errorMsg=document.getElementById('error-msg');
fetch('/api/auth/me').then(r=>r.json()).then(x=>{if(x.email)document.getElementById('email').textContent=x.email;});
inputs.forEach((input,i)=>{input.addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);if(e.target.value&&i<5)inputs[i+1].focus();});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!e.target.value&&i>0)inputs[i-1].focus();});input.addEventListener('paste',e=>{const d=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);if(d.length===6){e.preventDefault();d.split('').forEach((c,j)=>inputs[j].value=c);inputs[5].focus();}});});
function error(m){errorMsg.textContent=m;errorMsg.style.display='block';}
async function verify(){const otp=inputs.map(x=>x.value).join('');if(otp.length!==6)return error('Please enter all 6 digits.');const r=await fetch('/api/auth/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({otp})});const d=await r.json();if(!r.ok)return error(d.message||'Incorrect code.');window.location.href='/browse';}
document.getElementById('verify-btn').onclick=verify;
document.getElementById('resend-link').onclick=async e=>{e.preventDefault();const r=await fetch('/api/auth/resend-otp',{method:'POST'});const d=await r.json();if(!r.ok)return error(d.message||'Could not resend code.');errorMsg.style.display='block';errorMsg.style.color='#46d369';errorMsg.textContent='A new code was sent.';};
</script></body></html>
